{% extends "base.html" %}

{% block title %}
    Eliminar objeto | Segunda Vida
{% endblock %}

{% block content %}

    <section class="tarjeta">

        <h1> Eliminar objeto</h1>

        <p>
            ¿Estás segura de que quieres eliminar
            <strong>{{ objeto.nombre }}</strong>?
        </p>

        <form method="POST">

            {% csrf_token %}

            <button
                class="boton"
                type="submit"
            >
                Sí, eliminar
            </button>

        </form>

        <br>

        <a href="{% url 'detalle_objeto' objeto.id %}">
            ← Cancelar
        </a>

    </section>

{% endblock %}
